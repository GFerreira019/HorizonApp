{% load i18n %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Senha — HorizonAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0B1120; }
        .form-control {
            background-color: #0f172a; border: 1px solid #2a3449; color: #e2e8f0;
            border-radius: 0.75rem; padding: 0.875rem 1rem; width: 100%; display: block;
            font-size: 0.875rem; transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-control:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-tight">Horizon<span class="text-cyan-400">APP</span></h1>
        </div>
        <div class="bg-[#151e32] border border-[#1e2d47] rounded-3xl p-7 shadow-2xl shadow-black/40">
            <div class="text-center mb-6">
                <h2 class="text-lg font-bold text-white">Definir Nova Senha</h2>
                <p class="text-slate-400 text-xs mt-1">Escolha uma senha forte para sua conta.</p>
            </div>

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                {% for field in form %}
                <div>
                    <label class="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-1.5" for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>
                    <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                           class="form-control" placeholder="••••••••" required>
                    {% if field.errors %}
                        {% for error in field.errors %}
                        <p class="text-red-400 text-xs mt-1">{{ error }}</p>
                        {% endfor %}
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit"
                    class="w-full mt-2 py-3.5 rounded-xl font-bold text-sm text-white uppercase tracking-wide
                           bg-gradient-to-r from-cyan-600 to-teal-600 hover:from-cyan-500 hover:to-teal-500
                           shadow-lg shadow-cyan-900/40 active:scale-[0.98] transition-all duration-200">
                    <i class="bi bi-shield-check mr-1.5"></i> Salvar Nova Senha
                </button>
            </form>
        </div>
    </div>
</body>
</html>
