{% load i18n %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-mail Enviado — HorizonAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0B1120; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm text-center">
        <div class="bg-[#151e32] border border-[#1e2d47] rounded-3xl p-8 shadow-2xl shadow-black/40">
            <div class="h-16 w-16 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mx-auto mb-4">
                <i class="bi bi-envelope-check text-emerald-400 text-2xl"></i>
            </div>
            <h2 class="text-lg font-bold text-white mb-2">E-mail enviado!</h2>
            <p class="text-slate-400 text-sm leading-relaxed">
                Verifique sua caixa de entrada. O link de redefinição expira em <strong class="text-white">15 minutos</strong>.
            </p>
            <a href="{% url 'account_login' %}"
               class="mt-6 inline-flex items-center gap-2 text-xs font-bold text-cyan-400 hover:text-cyan-300 uppercase tracking-widest transition-colors">
                <i class="bi bi-arrow-left"></i> Voltar ao Login
            </a>
        </div>
    </div>
</body>
</html>
