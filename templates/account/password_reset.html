{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recuperar Senha — HorizonAPP</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="{% static 'img/icon.png' %}">
    
    <style>
        body { background-color: #0B1120; }
        .card-dark { background-color: #151e32; border: 1px solid #1e2d47; }
        .form-control {
            background-color: #0f172a; border: 1px solid #2a3449; color: #e2e8f0;
            border-radius: 0.75rem; padding: 0.875rem 1rem; width: 100%; display: block;
            font-size: 0.875rem; transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-control:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
        .form-control::placeholder { color: #475569; }
    </style>
</head>
<body class="min-h-full flex items-center justify-center p-4">
    <div class="text-center mb-7">
        <div class="inline-flex items-center justify-center h-12 w-12 rounded-2xl bg-white shadow-md shadow-black/20 mb-3 overflow-hidden border border-slate-100">
            <img src="{% static 'img/icon.png' %}" alt="Ícone HorizonAPP" class="h-8 w-8 object-contain">
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight mb-6">
            Horizon<span class="text-indigo-500">APP</span>
        </h1>
        <div class="card-dark rounded-3xl p-7 shadow-2xl shadow-black/40">
            <div class="text-center mb-6">
                <div class="h-12 w-12 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center mx-auto mb-3">
                    <i class="bi bi-key text-cyan-400 text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-white">Recuperar Senha</h2>
                <p class="text-slate-400 text-xs mt-1">Enviaremos um link de redefinição para seu e-mail.</p>
            </div>

            <form method="POST" action="{% url 'account_reset_password' %}" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-1.5" for="id_email">E-mail</label>
                    <input type="email" name="email" id="id_email" class="form-control" placeholder="seu@email.com" autocomplete="email" required autofocus>
                </div>
                <button type="submit"
                    class="w-full mt-2 py-3.5 rounded-xl font-bold text-sm text-white uppercase tracking-wide
                           bg-gradient-to-r from-cyan-600 to-teal-600 hover:from-cyan-500 hover:to-teal-500
                           shadow-lg shadow-cyan-900/40 active:scale-[0.98] transition-all duration-200">
                    <i class="bi bi-send mr-1.5"></i> Enviar Link
                </button>
            </form>

            <div class="mt-5 text-center">
                <a href="{% url 'account_login' %}" class="text-xs text-slate-500 hover:text-cyan-400 transition-colors">
                    <i class="bi bi-arrow-left mr-1"></i> Voltar ao Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
