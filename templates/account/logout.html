{% load i18n %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sair — HorizonAPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>body { background-color: #0B1120; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-xs text-center">
        <div class="bg-[#151e32] border border-[#1e2d47] rounded-3xl p-8 shadow-2xl shadow-black/40">
            <div class="h-14 w-14 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center mx-auto mb-4">
                <i class="bi bi-box-arrow-left text-red-400 text-2xl"></i>
            </div>
            <h2 class="text-base font-bold text-white mb-2">Sair da conta?</h2>
            <p class="text-slate-400 text-sm mb-6">Você será desconectado do HorizonAPP.</p>
            <form method="POST" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button type="submit"
                    class="w-full py-3 rounded-xl font-bold text-sm text-white bg-red-600 hover:bg-red-500
                           transition-all active:scale-[0.98] shadow-lg shadow-red-900/30">
                    Sim, sair agora
                </button>
            </form>
            <a href="{% url 'dashboard' %}"
               class="mt-3 block text-xs text-slate-500 hover:text-slate-300 transition-colors">
                Cancelar e voltar
            </a>
        </div>
    </div>
</body>
</html>
