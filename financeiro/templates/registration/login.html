{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center">
    <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white">Bem-vindo</h2>
            <p class="text-gray-400 mt-2">Faça login para gerenciar suas finanças</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="bg-red-900/30 border border-red-500 text-red-200 p-3 rounded-lg text-sm text-center">
                    Usuário ou senha incorretos.
                </div>
            {% endif %}

            <div>
                <label class="block text-sm font-bold text-indigo-400 mb-2">Usuário</label>
                <input type="text" name="username" class="form-control" placeholder="Seu usuário" required autofocus>
            </div>

            <div>
                <label class="block text-sm font-bold text-indigo-400 mb-2">Senha</label>
                <input type="password" name="password" class="form-control" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-indigo-500/20">
                Entrar no Sistema
            </button>
        </form>
    </div>
</div>
{% endblock %}
