{% load static %}
<div id="modalMacroProvisionamento" class="fixed inset-0 z-[55] hidden flex items-center justify-center p-4" aria-modal="true" role="dialog">
    <div class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm transition-opacity" onclick="fecharModalMacroProvisionamento()"></div>

    <div class="relative w-full max-w-sm bg-[#151e32] rounded-3xl shadow-2xl border border-slate-700 flex flex-col overflow-hidden transition-transform transform scale-95 opacity-0"
         id="modalMacroProvisionamentoContent" style="max-height: 85vh;">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-[#0B1120]/50 shrink-0">
            <div class="flex items-center gap-3 min-w-0">
                <div id="modalMacroIconeWrap" class="h-10 w-10 rounded-xl bg-[#0f172a] border border-slate-800 flex items-center justify-center text-lg shrink-0">
                    <i id="modalMacroIcone" class="bi bi-wallet2 text-cyan-400"></i>
                </div>
                <div class="min-w-0">
                    <h3 id="modalMacroTitulo" class="text-white font-bold tracking-wide text-sm truncate">Macro</h3>
                    <p id="modalMacroSubtitulo" class="text-[9px] text-slate-400 uppercase tracking-widest">Contas vinculadas</p>
                </div>
            </div>
            <button type="button" onclick="fecharModalMacroProvisionamento()"
                class="h-7 w-7 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition-colors shrink-0">
                <i class="bi bi-x-lg text-xs"></i>
            </button>
        </div>

        <div class="px-4 py-3 border-b border-slate-800/60 bg-[#0f172a]/30 shrink-0">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-0.5">Total provisionado</p>
            <p id="modalMacroSoma" class="text-xl font-black text-white tracking-tight">R$ 0,00</p>
        </div>

        <div id="modalMacroLista" class="p-3 overflow-y-auto flex-1 custom-scrollbar space-y-2 min-h-[120px]">
        </div>

        <!-- ── Rodapé com Quick Add + Cadastro Completo ─────────────── -->
        <div class="p-4 border-t border-slate-800 bg-[#0B1120]/50 shrink-0 space-y-3">

            <!-- Quick Add: Lançamento Rápido -->
            <div>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-2 flex items-center gap-1.5">
                    <i class="bi bi-lightning-charge-fill text-cyan-500"></i>
                    Lançamento Rápido
                </p>
                <!-- Feedback de erro inline -->
                <div id="quickAddErro" class="hidden mb-2 px-3 py-2 rounded-lg bg-red-500/10 border border-red-500/30 text-[10px] text-red-400 font-semibold flex items-center gap-1.5">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span id="quickAddErroTexto"></span>
                </div>
                <div class="flex gap-2 items-stretch">
                    <!-- Nome -->
                    <input
                        type="text"
                        id="quickAddNome"
                        placeholder="Ex: Conta Avulsa"
                        maxlength="100"
                        autocomplete="off"
                        class="flex-1 min-w-0 bg-[#0f172a] border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white font-semibold placeholder-slate-600 outline-none focus:border-cyan-500 transition-colors"
                    >
                    <!-- Valor -->
                    <div class="flex items-center w-28 shrink-0 bg-slate-800 border rounded-xl px-2 focus-within:border-cyan-500 transition-colors">

                        <span class="text-slate-500 font-bold text-xs select-none shrink-0 mr-0">
                            R$
                        </span>

                        <input
                            type="number"
                            id="quickAddValor"
                            placeholder="0,00"
                            min="0.01"
                            step="0.01"
                            class="w-full bg-transparent text-xs text-white font-bold placeholder-slate-600 border-none outline-none focus:ring-0 p-0 py-2.5"
                        >

                    </div>
                    <!-- Botão Adicionar -->
                    <button
                        type="button"
                        id="quickAddBtn"
                        onclick="adicionarValorAvulso()"
                        title="Adicionar lançamento rápido"
                        class="h-10 w-10 shrink-0 rounded-xl bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-white flex items-center justify-center transition-all shadow-[0_0_12px_rgba(8,145,178,0.25)]"
                    >
                        <i id="quickAddBtnIcone" class="bi bi-plus-lg text-base pointer-events-none"></i>
                    </button>
                </div>
            </div>

            <!-- Divisor "ou" -->
            <div class="flex items-center gap-3">
                <div class="flex-1 h-px bg-slate-800"></div>
                <span class="text-[9px] font-bold text-slate-600 uppercase tracking-widest">ou</span>
                <div class="flex-1 h-px bg-slate-800"></div>
            </div>

            <!-- Botão Cadastro Completo -->
            <button type="button" id="modalMacroBtnCadastrar"
                class="w-full py-3 rounded-xl text-xs font-bold uppercase tracking-wider bg-[#0f172a] border border-slate-700 hover:border-cyan-500/60 hover:text-cyan-400 text-slate-300 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <i class="bi bi-plus-circle"></i>
                <span id="modalMacroBtnCadastrarTexto">Cadastrar</span>
            </button>
        </div>
    </div>
</div>

<form id="formExcluirProvisionamento" method="POST" action="" class="hidden">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ redirect_next }}">
</form>

<script>
    window.HORIZON_PROVISIONAMENTOS_POR_MACRO = {{ provisionamentos_por_macro_json|default:"{}"|safe }};
    window.HORIZON_QUICK_ADD_URL = "{% url 'quick_add_provisionamento_ajax' %}";
    window.HORIZON_CSRF_TOKEN = "{{ csrf_token }}";
</script>
<script src="{% static 'financeiro/js/planejamento_macro_modal.js' %}"></script>
